name: LLM Eval Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pytest
      - name: Run tests
        run: |
          PYTHONPATH=src python3 -m pytest tests/ -v
