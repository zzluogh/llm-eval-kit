[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-eval-kit"
version = "0.1.0"
description = "LLM evaluation toolkit — RAGAS, Function Calling, Pipeline Trace, Needle-in-Haystack"
requires-python = ">=3.10"

[tool.pytest.ini_options]
markers = [
    "ragas: RAG quality evaluation tests",
    "tool_calling: Function calling accuracy tests",
    "pipeline: Pipeline trace diagnostic tests",
    "needle: Needle-in-haystack context tests",
    "slow: tests requiring mock server or long processing",
]
